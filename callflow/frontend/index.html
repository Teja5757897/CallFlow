<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CallFlow: an AI agent calls your customers, confirms a day and time, and emails the booking. Consent-first calling." />
    <meta name="theme-color" content="#FFF8F0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CallFlow: AI calls that book the slot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem("callflow-theme");
        if (t !== "dark") t = "light"; // light is the default look
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
